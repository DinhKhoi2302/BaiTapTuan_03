<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Điều Hướng - Trương Đình Khôi</title>
    <style>
        /* Import font chữ hiện đại từ Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Nền gradient chuyển động liên tục */
            background: linear-gradient(45deg, #a18cd1, #fbc2eb, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Các bong bóng lơ lửng trang trí nền */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            animation: float 8s infinite ease-in-out;
            filter: blur(4px);
            z-index: 1;
        }
        .circle:nth-child(1) { width: 150px; height: 150px; top: 10%; left: 15%; animation-duration: 10s; }
        .circle:nth-child(2) { width: 250px; height: 250px; bottom: -50px; right: 10%; animation-duration: 12s; }
        .circle:nth-child(3) { width: 100px; height: 100px; top: 40%; left: 80%; animation-duration: 7s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        /* Thẻ Container chứa nội dung chính (Hiệu ứng Glassmorphism) */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
            animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            opacity: 0;
            transform: scale(0.8) translateY(30px);
        }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .info-header {
            margin-bottom: 35px;
        }

        .info-header h1 {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-header p {
            color: #596275;
            font-size: 15px;
            line-height: 1.8;
            font-weight: 600;
        }

        .highlight {
            color: #6c5ce7;
            font-weight: 700;
            padding: 2px 8px;
            background: rgba(108, 92, 231, 0.1);
            border-radius: 6px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Nút bấm điều hướng */
        .nav-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 14px;
            text-decoration: none;
            color: #2d3436;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid rgba(255, 255, 255, 0.5);
            /* Animation trượt vào từng nút một */
            opacity: 0;
            transform: translateX(30px);
            animation: slideInRight 0.6s ease forwards;
        }

        .nav-item:nth-child(1) { animation-delay: 0.4s; }
        .nav-item:nth-child(2) { animation-delay: 0.6s; }
        .nav-item:nth-child(3) { animation-delay: 0.8s; }

        @keyframes slideInRight {
            to { opacity: 1; transform: translateX(0); }
        }

        .nav-item span {
            position: relative;
            z-index: 2;
            transition: color 0.4s ease;
        }

        /* Icon mũi tên */
        .nav-item .icon {
            position: relative;
            z-index: 2;
            width: 30px;
            height: 30px;
            background: #f1f2f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .nav-item .icon::after {
            content: '➔';
            font-size: 14px;
            color: #2d3436;
            transition: all 0.4s ease;
        }

        /* Hiệu ứng màu nền chạy từ trái sang phải khi Hover */
        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            z-index: 1;
            transform: translateX(-101%);
            transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Kích hoạt Hover */
        .nav-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(108, 92, 231, 0.25);
            border-color: transparent;
        }

        .nav-item:hover::before {
            transform: translateX(0);
        }

        .nav-item:hover span {
            color: #ffffff;
        }

        .nav-item:hover .icon {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(3px) scale(1.1);
        }

        .nav-item:hover .icon::after {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="container">
        <div class="info-header">
            <h1>Hệ Thống & Công Nghệ Web</h1>
            <p>Họ và tên: <span class="highlight">Trương Đình Khôi</span><br> 
               Mã số sinh viên: <span class="highlight">24697941</span></p>
        </div>
        
        <div class="nav-menu">
            <a href="T03-Bai1.html" class="nav-item">
                <span>📁 Mở Bài Tập 1</span>
                <div class="icon"></div>
            </a>
            <a href="T03-Bai2.html" class="nav-item">
                <span>📁 Mở Bài Tập 2</span>
                <div class="icon"></div>
            </a>
            <a href="T03-Bai3.html" class="nav-item">
                <span>📁 Mở Bài Tập 3</span>
                <div class="icon"></div>
            </a>
        </div>
    </div>
</body>
</html>
